<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrevistas</title>
  <style>
    body{margin:0;background:#0f1120;color:#eceeff;font-family:Inter,system-ui,sans-serif}.app{max-width:1180px;margin:0 auto;padding:24px}.card{background:#171a2f;border:1px solid #2b315f;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:#222a58;border:1px solid #3b488a;color:#f5f6ff;border-radius:8px;padding:8px 11px;cursor:pointer;text-decoration:none}.btn.primary{background:#624de5}.btn.danger{background:#4d2330}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #2f3a74;border-radius:10px;padding:10px}.muted{color:#aab0d8}.hidden{display:none}input,select,textarea{width:100%;background:#0f1328;border:1px solid #314079;color:#edf0ff;border-radius:8px;padding:8px;margin:6px 0}#modal{position:fixed;inset:0;background:#070910bb;display:none;align-items:center;justify-content:center;padding:20px}.modal-box{width:min(820px,95vw);max-height:88vh;overflow:auto}.toast{position:fixed;right:16px;bottom:16px;background:#352c86;border:1px solid #7162f4;border-radius:10px;padding:10px 14px}
  </style>
</head>
<body>
  <div class="app">
    <div class="card row" style="justify-content:space-between"><div><h1 style="margin:0">Entrevistas</h1><p class="muted" style="margin:.3rem 0 0">CRM mínimo + entrevistas guiadas + adjuntos</p></div><a class="btn" href="/">Home</a></div>
    <div class="card row">
      <button class="btn primary" data-tab="clients">Clientes</button>
      <button class="btn" data-tab="run">Realizar entrevista</button>
      <button class="btn" data-tab="templates">Plantillas</button>
      <button class="btn" data-tab="sessions">Entrevistas realizadas</button>
    </div>

    <section id="tab-clients" class="card"></section>
    <section id="tab-run" class="card hidden"></section>
    <section id="tab-templates" class="card hidden"></section>
    <section id="tab-sessions" class="card hidden"></section>
  </div>
  <div id="modal"><div class="modal-box card" id="modalBox"></div></div>
  <script>
  const API_BASE = localStorage.getItem('ce_api_base') || location.origin || 'http://127.0.0.1:8000';
  const state = { tab:'clients', clients:[], templates:[], sessions:[], projects:[], hypotheses:[], attachments:[], selectedClient:null, run:{ project_id:1, hypothesis_id:'', client_id:'', template_id:'', metric_name:'', interviewee_name:'', notes:'', responses:{}, session_id:null } };
  const $ = (s)=>document.querySelector(s); const esc=(t)=>String(t??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const toast=(m)=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)};
  async function api(path, init){const r=await fetch(API_BASE+path,init); if(!r.ok) throw new Error(await r.text()); return r.json();}
  async function loadBase(){
    try{state.clients=await api('/clients');}catch{state.clients=[]}
    try{state.projects=await api('/api/cloud/projects');}catch{state.projects=[]}
    await loadTemplates(); await loadSessions(); render();
  }
  async function loadTemplates(){ try{state.templates=await api(`/api/interviews/projects/${state.run.project_id}/templates`)}catch{state.templates=[]} }
  async function loadSessions(){ try{state.sessions=await api('/api/interviews?limit=200')}catch{state.sessions=[]} }
  async function loadHypotheses(){ try{state.hypotheses=await api(`/api/cloud/projects/${state.run.project_id}/hypotheses`)}catch{state.hypotheses=[]} }

  function renderTabs(){ document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===state.tab;b.classList.toggle('primary',on);}); ['clients','run','templates','sessions'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==state.tab)); }

  function renderClients(){
    $('#tab-clients').innerHTML=`<div class='row' style='justify-content:space-between'><h2>Clientes</h2><button class='btn primary' id='btnNewClient'>Crear cliente</button></div><div class='grid'><input id='clientSearch' placeholder='Buscar por nombre, email, teléfono, país'><input id='clientCountry' placeholder='Filtrar país'></div><div id='clientsList' class='list'></div>`;
    const draw=()=>{const q=$('#clientSearch').value.toLowerCase(), c=$('#clientCountry').value.toLowerCase(); const rows=state.clients.filter(x=>(!q||`${x.full_name} ${x.email||''} ${x.phone||''} ${x.country||''}`.toLowerCase().includes(q))&&(!c||String(x.country||'').toLowerCase().includes(c))); $('#clientsList').innerHTML=rows.length?rows.map(x=>`<article class='item'><div><strong>${esc(x.full_name)}</strong><p class='muted'>${esc(x.country)} · ${esc(x.email||'sin email')} · ${esc(x.phone||'sin teléfono')}</p></div><div class='row'><button class='btn' data-open='${x.id}'>Detalle</button></div></article>`).join(''):`<p class='muted'>No hay clientes todavía.</p>`; document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openClientDetail(Number(b.dataset.open))); };
    $('#clientSearch').oninput=draw; $('#clientCountry').oninput=draw; draw();
    $('#btnNewClient').onclick=()=>openClientForm();
  }
  function modal(html){ $('#modalBox').innerHTML=html; $('#modal').style.display='flex'; }
  $('#modal').onclick=(e)=>{ if(e.target.id==='modal') $('#modal').style.display='none'; };
  function openClientForm(){ modal(`<h3>Crear cliente</h3><div class='grid'><input id='c_name' placeholder='Nombre completo*'><input id='c_country' placeholder='País*'></div><div class='grid'><input id='c_email' placeholder='Email'><input id='c_phone' placeholder='Teléfono'></div><textarea id='c_notes' rows='4' placeholder='Notas'></textarea><div class='row'><button class='btn' id='m_cancel'>Cancelar</button><button class='btn primary' id='m_save'>Guardar</button></div><p id='m_err' class='muted'></p>`); $('#m_cancel').onclick=()=>$('#modal').style.display='none'; $('#m_save').onclick=async()=>{const p={full_name:$('#c_name').value,country:$('#c_country').value,email:$('#c_email').value,phone:$('#c_phone').value,notes:$('#c_notes').value,tags:[]}; if(!p.full_name||!p.country){$('#m_err').textContent='Nombre y país obligatorios';return;} try{await api('/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}); state.clients=await api('/clients'); $('#modal').style.display='none'; renderClients(); toast('Cliente creado');}catch(e){$('#m_err').textContent=e.message;}}; }
  async function openClientDetail(id){ const c=state.clients.find(x=>x.id===id); if(!c) return; const iv=await api(`/clients/${id}/interviews`).catch(()=>[]); modal(`<div class='row' style='justify-content:space-between'><h3>${esc(c.full_name)}</h3><button class='btn' id='m_close'>Cerrar</button></div><p class='muted'>${esc(c.country)} · ${esc(c.email||'sin email')} · ${esc(c.phone||'sin teléfono')}</p><p>${esc(c.notes||'Sin notas')}</p><div class='row'><button class='btn primary' id='m_run'>Nueva entrevista para este cliente</button><button class='btn danger' id='m_del'>Eliminar cliente</button></div><h4>Entrevistas del cliente</h4>${iv.length?`<div class='list'>${iv.map(s=>`<div class='item'><span>#${s.id} · ${new Date(s.created_at).toLocaleString()}</span><span class='muted'>${esc(s.metric_name||'sin métrica')}</span></div>`).join('')}</div>`:`<p class='muted'>No tiene entrevistas aún.</p>`}`); $('#m_close').onclick=()=>$('#modal').style.display='none'; $('#m_run').onclick=()=>{ state.run.client_id=id; state.tab='run'; $('#modal').style.display='none'; render();}; $('#m_del').onclick=async()=>{if(!confirm('¿Eliminar cliente?'))return; await api(`/clients/${id}`,{method:'DELETE'}); state.clients=await api('/clients'); $('#modal').style.display='none'; renderClients(); toast('Cliente eliminado');}; }

  function renderTemplates(){
    $('#tab-templates').innerHTML=`<div class='row' style='justify-content:space-between'><h2>Plantillas</h2><div class='row'><input type='number' id='tplProject' value='${state.run.project_id}' style='width:120px'><button class='btn primary' id='btnNewTpl'>Crear plantilla</button></div></div><div id='tplList' class='list'></div>`;
    $('#tplProject').onchange=async(e)=>{state.run.project_id=Number(e.target.value)||1; await loadTemplates(); await loadHypotheses(); renderTemplates();};
    $('#btnNewTpl').onclick=()=>openTplEditor();
    const list=$('#tplList'); list.innerHTML=state.templates.length?state.templates.map(t=>`<div class='item'><div><strong>${esc(t.name)}</strong><p class='muted'>${esc(t.description||'Sin descripción')}</p></div><div class='row'><button class='btn' data-edit='${t.id}'>Editar</button><button class='btn danger' data-del='${t.id}'>Eliminar</button></div></div>`).join(''):`<p class='muted'>No hay plantillas para este proyecto.</p>`;
    document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTplEditor(Number(b.dataset.edit)));
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar plantilla?'))return; await api(`/api/interviews/templates/${b.dataset.del}`,{method:'DELETE'}); await loadTemplates(); renderTemplates(); toast('Plantilla eliminada');});
  }
  function openTplEditor(id){ const t=state.templates.find(x=>x.id===id)||{name:'',description:'',fields_json:{questions:[]}}; const questions=JSON.parse(JSON.stringify(t.fields_json?.questions||[])); const redraw=()=>{ modal(`<h3>${id?'Editar':'Nueva'} plantilla</h3><input id='tp_name' placeholder='Nombre' value='${esc(t.name||'')}'><textarea id='tp_desc' rows='3' placeholder='Descripción'>${esc(t.description||'')}</textarea><button class='btn' id='addQ'>Agregar pregunta</button><div id='qList' class='list'></div><div class='row'><button class='btn' id='cl'>Cancelar</button><button class='btn primary' id='sv'>Guardar</button></div>`); $('#addQ').onclick=()=>{questions.push({id:crypto.randomUUID(),label:'',type:'short_text',required:false,options:[]}); redraw();}; $('#cl').onclick=()=>$('#modal').style.display='none'; $('#sv').onclick=async()=>{const payload={project_id:state.run.project_id,name:$('#tp_name').value,description:$('#tp_desc').value,fields_json:{questions}}; if(id) await api(`/api/interviews/templates/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); else await api('/api/interviews/templates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); await loadTemplates(); $('#modal').style.display='none'; renderTemplates(); toast('Plantilla guardada');}; $('#qList').innerHTML=questions.map((q,i)=>`<div class='item' style='display:block'><input data-l='${i}' placeholder='Pregunta' value='${esc(q.label||'')}'><select data-t='${i}'>${['short_text','long_text','multiple_choice','checkbox','scale_1_5'].map(v=>`<option value='${v}' ${q.type===v?'selected':''}>${v}</option>`).join('')}</select>${(q.type==='multiple_choice'||q.type==='checkbox')?`<textarea data-o='${i}' placeholder='Opciones (una por línea)'>${esc((q.options||[]).join('\n'))}</textarea>`:''}<label><input type='checkbox' data-r='${i}' ${q.required?'checked':''}> Requerida</label><div class='row'><button class='btn' data-u='${i}'>↑</button><button class='btn' data-d='${i}'>↓</button><button class='btn danger' data-x='${i}'>Eliminar</button></div></div>`).join(''); document.querySelectorAll('[data-l]').forEach(el=>el.oninput=e=>questions[e.target.dataset.l].label=e.target.value); document.querySelectorAll('[data-t]').forEach(el=>el.onchange=e=>{questions[e.target.dataset.t].type=e.target.value;questions[e.target.dataset.t].options=[];redraw();}); document.querySelectorAll('[data-o]').forEach(el=>el.oninput=e=>questions[e.target.dataset.o].options=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean)); document.querySelectorAll('[data-r]').forEach(el=>el.onchange=e=>questions[e.target.dataset.r].required=e.target.checked); document.querySelectorAll('[data-x]').forEach(el=>el.onclick=e=>{questions.splice(Number(e.target.dataset.x),1);redraw();}); document.querySelectorAll('[data-u]').forEach(el=>el.onclick=e=>{const i=Number(e.target.dataset.u); if(i>0){[questions[i-1],questions[i]]=[questions[i],questions[i-1]]; redraw();}}); document.querySelectorAll('[data-d]').forEach(el=>el.onclick=e=>{const i=Number(e.target.dataset.d); if(i<questions.length-1){[questions[i+1],questions[i]]=[questions[i],questions[i+1]]; redraw();}}); };
    redraw();
  }

  function renderRun(){
    const template=state.templates.find(t=>t.id==state.run.template_id);
    $('#tab-run').innerHTML=`<h2>Realizar entrevista</h2><h4>Paso 1 · Contexto</h4><div class='grid'><select id='r_project'><option value=''>Proyecto</option>${state.projects.map(p=>`<option value='${p.id}' ${state.run.project_id==p.id?'selected':''}>${esc(p.project_name)}</option>`).join('')}</select><select id='r_hyp'><option value=''>Hipótesis</option>${state.hypotheses.map(h=>`<option value='${h.experiment_id}' ${state.run.hypothesis_id==h.experiment_id?'selected':''}>${esc(h.display_name)}</option>`).join('')}</select></div><input id='r_metric' placeholder='Métrica X o variable X' value='${esc(state.run.metric_name)}'><h4>Paso 2 · Cliente</h4><select id='r_client'><option value=''>Cliente</option>${state.clients.map(c=>`<option value='${c.id}' ${state.run.client_id==c.id?'selected':''}>${esc(c.full_name)} · ${esc(c.country)}</option>`).join('')}</select><h4>Paso 3 · Plantilla</h4><select id='r_template'><option value=''>Plantilla</option>${state.templates.map(t=>`<option value='${t.id}' ${state.run.template_id==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><h4>Paso 4 · Entrevista</h4><input id='r_name' placeholder='Nombre entrevistado' value='${esc(state.run.interviewee_name)}'><div id='runQuestions'></div><textarea id='r_notes' rows='7' placeholder='Notas libres'>${esc(state.run.notes)}</textarea><div class='row'><button class='btn primary' id='saveInterview'>Guardar entrevista</button><span class='muted' id='saveState'></span></div><h4>Paso 5 · Archivos de transcripción</h4><input id='r_file' type='file' accept='.txt,.pdf,.doc,.docx'><div id='attachList' class='list'></div>`;
    $('#r_project').onchange=async e=>{state.run.project_id=Number(e.target.value)||1; await loadTemplates(); await loadHypotheses(); renderRun();}; $('#r_hyp').onchange=e=>state.run.hypothesis_id=e.target.value?Number(e.target.value):''; $('#r_metric').oninput=e=>state.run.metric_name=e.target.value; $('#r_client').onchange=e=>state.run.client_id=e.target.value?Number(e.target.value):''; $('#r_template').onchange=e=>{state.run.template_id=e.target.value?Number(e.target.value):''; renderRun();}; $('#r_name').oninput=e=>state.run.interviewee_name=e.target.value; $('#r_notes').oninput=e=>state.run.notes=e.target.value;
    const qDiv=$('#runQuestions'); qDiv.innerHTML=template?template.fields_json.questions.map(q=>`<div><label>${esc(q.label)} ${q.required?'*':''}</label>${q.type==='short_text'?`<input data-q='${q.id}' value='${esc(state.run.responses[q.id]||'')}'>`:q.type==='long_text'?`<textarea data-q='${q.id}'>${esc(state.run.responses[q.id]||'')}</textarea>`:q.type==='multiple_choice'?`<select data-q='${q.id}'><option value=''>Selecciona</option>${(q.options||[]).map(o=>`<option ${state.run.responses[q.id]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:q.type==='checkbox'?`<div>${(q.options||[]).map(o=>`<label><input type='checkbox' data-q='${q.id}' data-opt='${esc(o)}' ${(Array.isArray(state.run.responses[q.id])&&state.run.responses[q.id].includes(o))?'checked':''}> ${esc(o)}</label>`).join(' ')}</div>`:`<input type='range' min='1' max='5' data-q='${q.id}' value='${Number(state.run.responses[q.id]||3)}'>`}</div>`).join(''):`<p class='muted'>Selecciona una plantilla para renderizar preguntas.</p>`;
    qDiv.querySelectorAll('[data-q]').forEach(el=>{el.oninput=el.onchange=(e)=>{const id=e.target.dataset.q; if(e.target.dataset.opt){const arr=Array.isArray(state.run.responses[id])?state.run.responses[id]:[]; if(e.target.checked){if(!arr.includes(e.target.dataset.opt))arr.push(e.target.dataset.opt);} else {const idx=arr.indexOf(e.target.dataset.opt); if(idx>=0)arr.splice(idx,1);} state.run.responses[id]=arr;} else state.run.responses[id]=e.target.value;};});
    const drawAttachments=()=>$('#attachList').innerHTML=state.attachments.length?state.attachments.map(a=>`<div class='item'><div><strong>${esc(a.filename)}</strong><p class='muted'>${Math.round(a.size/1024)} KB · ${new Date(a.created_at).toLocaleString()}</p></div><button class='btn danger' data-ad='${a.id}'>Eliminar</button></div>`).join(''):`<p class='muted'>No hay archivos adjuntos.</p>`; drawAttachments();
    document.querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{await api(`/api/attachments/${b.dataset.ad}`,{method:'DELETE'}); if(state.run.session_id) state.attachments=await api(`/api/interviews/${state.run.session_id}/attachments`); drawAttachments();});
    async function persist(autosave=false){ if(!state.run.project_id||!state.run.template_id||!state.run.client_id||!state.run.interviewee_name.trim()) return; $('#saveState').textContent='Guardando…'; const payload={project_id:state.run.project_id,hypothesis_id:state.run.hypothesis_id||null,client_id:state.run.client_id||null,template_id:state.run.template_id,metric_name:state.run.metric_name,interviewee_name:state.run.interviewee_name,responses_json:state.run.responses,notes:state.run.notes}; const saved=state.run.session_id?await api(`/api/interviews/${state.run.session_id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}):await api('/api/interviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); state.run.session_id=saved.id; state.attachments=await api(`/api/interviews/${saved.id}/attachments`); drawAttachments(); $('#saveState').textContent='Guardado'; if(!autosave){toast('Entrevista guardada'); await loadSessions(); if(state.tab==='sessions') renderSessions();}}
    $('#saveInterview').onclick=()=>persist(false); setTimeout(()=>persist(true),15000);
    $('#r_file').onchange=async e=>{const f=e.target.files?.[0]; if(!f){return;} if(!state.run.session_id){toast('Guarda la entrevista antes de adjuntar archivos'); return;} const fd=new FormData(); fd.append('file',f); const r=await fetch(API_BASE+`/api/interviews/${state.run.session_id}/attachments`,{method:'POST',body:fd}); if(!r.ok){toast('Error al subir archivo');return;} state.attachments=await api(`/api/interviews/${state.run.session_id}/attachments`); drawAttachments(); toast('Archivo adjuntado');};
  }

  function renderSessions(){ $('#tab-sessions').innerHTML=`<h2>Entrevistas realizadas</h2>${state.sessions.length?`<div class='list'>${state.sessions.map(s=>`<div class='item'><div><strong>#${s.id} · ${esc(s.interviewee_name)}</strong><p class='muted'>Proyecto ${s.project_id} · Hipótesis ${s.hypothesis_id||'-'} · Cliente ${s.client_id||'-'} · ${new Date(s.created_at).toLocaleString()}</p></div><span class='muted'>${esc(s.metric_name||'sin métrica')}</span></div>`).join('')}</div>`:`<p class='muted'>No hay entrevistas todavía.</p>`; }

  function render(){ renderTabs(); renderClients(); renderTemplates(); renderRun(); renderSessions(); }

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab; render();});
  loadBase().then(async()=>{await loadHypotheses(); render();});
  </script>
</body>
</html>
