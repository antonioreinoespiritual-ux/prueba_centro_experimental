<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat — Centro Experimental</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
  <style>
    .chat-shell { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 64px); gap: var(--space-md); }
    .chat-panel { background: var(--surface-2); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: var(--space-lg); box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--space-md); padding-right: var(--space-sm); }
    .chat-message { max-width: 80%; padding: var(--space-md); border-radius: 12px; font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; }
    .chat-message--user { align-self: flex-end; background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.35); }
    .chat-message--assistant { align-self: flex-start; background: var(--surface-1); border: 1px solid var(--glass-border); }
    .chat-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-xs); }
    .chat-input { display: grid; grid-template-columns: 1fr auto; gap: var(--space-sm); align-items: end; }
    .chat-input textarea { min-height: 64px; resize: vertical; }
    .chat-status { font-size: 0.8rem; color: var(--text-muted); }
    .chat-warning { border: 1px solid rgba(248,113,113,0.5); background: rgba(248,113,113,0.1); color: #fecaca; padding: var(--space-sm) var(--space-md); border-radius: 12px; font-size: 0.85rem; }
    .chat-error { border: 1px solid rgba(248,113,113,0.5); background: rgba(248,113,113,0.1); color: #fecaca; padding: var(--space-sm) var(--space-md); border-radius: 12px; font-size: 0.85rem; }
    .chat-status--error { color: var(--danger); }
    details.chat-refs { margin-top: var(--space-xs); }
    details.chat-refs summary { cursor: pointer; color: var(--accent); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="app-container" role="main">
    <div class="top-bar">
      <div>
        <h1 class="top-bar__title">Chat del Centro Experimental</h1>
        <p class="top-bar__subtitle">Asistente con contexto en tiempo real.</p>
      </div>
      <div class="top-bar__actions">
        <a class="btn-link" href="/" aria-label="Volver a Home">Volver</a>
        <button id="btnNewConversation" class="btn-secondary">Nueva conversación</button>
      </div>
    </div>

    <div class="card">
      <div class="flex gap-sm items-center">
        <span class="tag">Modelo activo:</span>
        <button id="btnChat1" class="btn-ai" type="button">Chat 1</button>
        <button id="btnChat2" class="btn-secondary" type="button">Chat 2</button>
        <span class="text-xs text-muted" id="modelHint">Chat 1 usa el modelo actual.</span>
      </div>
    </div>

    <div class="chat-shell">
      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-status mt-sm" id="chatStatus">Listo.</div>
      </div>

      <div class="card">
        <div class="chat-input">
          <div>
            <label for="chatInput">Escribe tu mensaje</label>
            <textarea id="chatInput" placeholder="Pregunta sobre proyectos, hipótesis, records, públicos..."></textarea>
          </div>
          <button id="btnSend" class="btn-ai">Enviar</button>
        </div>
        <div class="text-xs text-muted mt-sm">Enter para enviar · Shift+Enter para nueva línea</div>
      </div>
    </div>
  </div>

  <script>
    const FALLBACK_API = "http://127.0.0.1:8000";
    const API_BASE = localStorage.getItem("ce_api_base")
      || (window.location.origin && window.location.origin !== "null" ? window.location.origin : "")
      || FALLBACK_API;
    const STORAGE_KEY = "ce_chat_consult_messages";
    const STORAGE_CONVO_KEY = "ce_chat_consult_conversation_id";
    const STORAGE_MODEL_KEY = "ce_chat_consult_model";
    const MODEL_CHAT_1 = "";
    const MODEL_CHAT_2 = "meta-llama/llama-4-scout-17b-16e-instruct";
    const $ = (id) => document.getElementById(id);
    const isFileProtocol = window.location.protocol === "file:";

    function loadConversationId() {
      let convo = localStorage.getItem(STORAGE_CONVO_KEY);
      if (!convo) {
        convo = `consult-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
        localStorage.setItem(STORAGE_CONVO_KEY, convo);
      }
      return convo;
    }

    function loadMessages() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        return JSON.parse(raw);
      } catch (e) {
        return [];
      }
    }

    function loadModel() {
      return localStorage.getItem(STORAGE_MODEL_KEY) || MODEL_CHAT_1;
    }

    function saveModel(model) {
      localStorage.setItem(STORAGE_MODEL_KEY, model);
      updateModelUI(model);
    }

    function updateModelUI(model) {
      const isChat2 = model === MODEL_CHAT_2;
      $("btnChat1").className = isChat2 ? "btn-secondary" : "btn-ai";
      $("btnChat2").className = isChat2 ? "btn-ai" : "btn-secondary";
      $("modelHint").textContent = isChat2
        ? "Chat 2 usa meta-llama/llama-4-scout-17b-16e-instruct."
        : "Chat 1 usa el modelo actual.";
    }

    function saveMessages(messages) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function renderMessages(messages) {
      const container = $("chatMessages");
      container.innerHTML = "";
      messages.forEach(msg => {
        const bubble = document.createElement("div");
        bubble.className = `chat-message chat-message--${msg.role}`;
        bubble.textContent = msg.content;
        container.appendChild(bubble);
        if (msg.refs) {
          const details = document.createElement("details");
          details.className = "chat-refs";
          const summary = document.createElement("summary");
          summary.textContent = "Referencias / Contexto";
          const pre = document.createElement("pre");
          pre.className = "chat-meta";
          pre.textContent = JSON.stringify(msg.refs, null, 2);
          details.appendChild(summary);
          details.appendChild(pre);
          container.appendChild(details);
        }
      });
      container.scrollTop = container.scrollHeight;
    }

    function setStatus(text, tone = "default") {
      const status = $("chatStatus");
      status.textContent = text;
      status.className = `chat-status mt-sm${tone === "error" ? " chat-status--error" : ""}`;
    }

    async function sendMessage() {
      const textarea = $("chatInput");
      const content = textarea.value.trim();
      if (!content) return;
      const convoId = loadConversationId();
      const model = loadModel();
      const messages = loadMessages();
      messages.push({ role: "user", content });
      saveMessages(messages);
      renderMessages(messages);
      textarea.value = "";
      setStatus("Enviando…");
      $("btnSend").disabled = true;
      $("btnSend").textContent = "Enviando…";

      try {
        const response = await fetch(`${API_BASE}/api/chat/consult`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: content, conversation_id: convoId, model }),
        });
        let data = null;
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(errorText || "Error desconocido");
        }
        try {
          data = await response.json();
        } catch (jsonError) {
          throw new Error("Respuesta inválida del servidor (JSON).");
        }
        if (!data || typeof data.answer !== "string") {
          throw new Error("Respuesta sin contenido.");
        }
        messages.push({ role: "assistant", content: data.answer, refs: data.refs || null });
        saveMessages(messages);
        renderMessages(messages);
        setStatus("Listo.");
      } catch (error) {
        const errorMessage = `Error al enviar el mensaje: ${error.message}`;
        messages.push({ role: "assistant", content: errorMessage, refs: null });
        saveMessages(messages);
        renderMessages(messages);
        setStatus(errorMessage, "error");
      } finally {
        $("btnSend").disabled = false;
        $("btnSend").textContent = "Enviar";
      }
    }

    function resetConversation() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_CONVO_KEY);
      localStorage.removeItem(STORAGE_MODEL_KEY);
      renderMessages([]);
      setStatus("Nueva conversación iniciada.");
      updateModelUI(MODEL_CHAT_1);
    }

    $("btnSend").addEventListener("click", sendMessage);
    $("btnNewConversation").addEventListener("click", resetConversation);
    $("btnChat1").addEventListener("click", () => saveModel(MODEL_CHAT_1));
    $("btnChat2").addEventListener("click", () => saveModel(MODEL_CHAT_2));
    $("chatInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    renderMessages(loadMessages());
    updateModelUI(loadModel());
    if (isFileProtocol) {
      const container = $("chatMessages");
      const warn = document.createElement("div");
      warn.className = "chat-warning";
      warn.textContent = "Este chat debe abrirse desde el servidor: http://127.0.0.1:8000/static/chat.html";
      container.appendChild(warn);
      setStatus("Advertencia: archivo abierto vía file://", "error");
    }
  </script>
</body>
</html>
